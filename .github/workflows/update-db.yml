name: Update version db

on:
  workflow_dispatch:
    inputs:
      tag:
        description: LeviLamina tag to add, e.g. v26.60.8 (default the highest version tag)
        required: false
        type: string
  repository_dispatch:
    types: [update-db]

permissions:
  contents: write

jobs:
  update-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run update script
        env:
          # The release workflow of LeviLamina sends the tag it published in client_payload.
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
        run: bash ./update-db.sh

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push changes if any
        run: |
          if git diff --quiet; then
            exit 0
          fi
          cp v2/version-db.json version-db.json
          git add .
          git commit -m "Update version db"
          git push origin HEAD

